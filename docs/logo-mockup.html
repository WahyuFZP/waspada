<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup Logo WASPADA</title>
<style>
  :root { --bg:#070d08; --surface:#0d170f; --line:#213426; --green:#60b45f; --deep:#3f7a40; --gold:#d6af58; --ink:#f1f4ef; --muted:#a7b8a6; --paper:#f1f4ef; --pine:#14301a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 system-ui,sans-serif; padding:32px 16px; }
  main { max-width:1040px; margin:auto; display:grid; gap:28px; }
  article { border:1px solid var(--line); border-radius:12px; background:var(--surface); overflow:hidden; }
  header { padding:20px 24px 0; }
  h2 { margin:0; font-size:22px; }
  header p { margin:4px 0 0; color:var(--muted); }
  .stage { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:1px; background:var(--line); margin-top:20px; border-block:1px solid var(--line); }
  .panel { display:flex; align-items:center; justify-content:center; gap:20px; padding:36px 24px; min-height:190px; background:var(--bg); }
  .panel.light { background:var(--paper); }
  .lockup svg.mark { width:72px; height:72px; flex:none; }
  .lockup svg.word { width:200px; height:auto; }
  .fav { display:flex; align-items:end; gap:18px; flex-wrap:wrap; }
  .fav figure { margin:0; text-align:center; font-size:12px; color:var(--muted); }
  .tab { display:flex; align-items:center; gap:8px; padding:8px 12px; background:#1d2a20; border-radius:8px 8px 0 0; font-size:13px; }
  .tab svg { width:16px; height:16px; }
  .meaning { padding:20px 24px 24px; display:grid; gap:6px 24px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); }
  .meaning b { display:block; color:var(--gold); font-weight:600; font-size:13px; }
  .meaning span { color:var(--muted); font-size:15px; }
</style>
</head>
<body>
<main id="app"></main>
<script>
// Huruf digambar sendiri di kisi tinggi 100, bukan font siap pakai; tiap konsep punya bentuk S, D, dan A berbeda
const GLYPH = {
  W: { w: 96, d: "M0 0L22 100L48 28L74 100L96 0" },
  P: { w: 62, d: "M0 100V0H62V56H0" },
};
const STYLE = {
  kentongan: { sw: 15, cap: "round", join: "round",
    S: "M66 14Q58 0 34 0Q4 0 4 25Q4 50 34 50Q66 50 66 75Q66 100 34 100Q8 100 0 84", D: "M0 100V0H24Q70 0 70 50Q70 100 24 100Z",
    A: (x) => `<path d="M${x} 100L${x + 36} 0L${x + 72} 100M${x + 14} 66H${x + 58}"/>` },
  sandi: { sw: 10, cap: "butt", join: "miter",
    S: "M66 0H4V50H66V100H0", D: "M0 0H66V100H0Z",
    A: (x, c) => `<path d="M${x} 100L${x + 36} 0L${x + 72} 100"/><path stroke="${c}" d="M${x + 27} 66H${x + 45}"/>` },
  jaga: { sw: 14, cap: "butt", join: "miter",
    S: "M68 0H16L2 14V36L16 50H52L66 64V86L52 100H0", D: "M0 0H46L70 24V76L46 100H0Z",
    A: (x, c) => `<path d="M${x} 100L${x + 36} 0L${x + 72} 100"/><circle cx="${x + 36}" cy="74" r="10" fill="${c}" stroke="none"/>` },
};

function word(style, ink, accent) {
  const s = STYLE[style];
  let x = 0, out = "";
  for (const ch of "WASPADA") {
    if (ch === "A") { out += s.A(x, accent); x += 72; }
    else if (ch === "S") { out += `<path d="${s.S}" transform="translate(${x})"/>`; x += 68; }
    else if (ch === "D") { out += `<path d="${s.D}" transform="translate(${x})"/>`; x += 70; }
    else { out += `<path d="${GLYPH[ch].d}" transform="translate(${x})"/>`; x += GLYPH[ch].w; }
    x += 24;
  }
  return `<svg class="word" role="img" aria-label="WASPADA" viewBox="-10 -10 ${x - 4} 120" fill="none" stroke="${ink}" stroke-width="${s.sw}" stroke-linecap="${s.cap}" stroke-linejoin="${s.join}">${out}</svg>`;
}

// Tiap lambang digambar di kisi 64 dan tanpa detail halus, agar tetap terbaca pada ukuran 16 piksel
const MARK = {
  kentongan: (a, b) => `<path fill="${a}" fill-rule="evenodd" d="M32 3a3 3 0 0 1 3 3v3h3a11 11 0 0 1 11 11v30a11 11 0 0 1-11 11H26a11 11 0 0 1-11-11V20A11 11 0 0 1 26 9h3V6a3 3 0 0 1 3-3zM28 20v30a4 4 0 0 0 8 0V20a4 4 0 0 0-8 0z"/>`
    + `<rect x="3" y="24" width="6" height="22" rx="3" fill="${b}"/><rect x="55" y="24" width="6" height="22" rx="3" fill="${b}"/>`,
  sandi: (a, b) => `<rect x="2" y="2" width="60" height="60" rx="12" fill="${a}"/><circle cx="14" cy="32" r="7" fill="${b}"/><rect x="25" y="25" width="16" height="14" fill="${b}"/><rect x="45" y="25" width="13" height="14" fill="${b}"/>`,
  jaga: (a, b) => `<path d="M6 16L19 56L32 32L45 56L58 16" fill="none" stroke="${a}" stroke-width="11" stroke-linejoin="miter"/><circle cx="32" cy="14" r="8" fill="${b}"/>`,
};
const svgMark = (k, a, b, cls = "mark", size = "") => `<svg class="${cls}" ${size} viewBox="0 0 64 64" aria-hidden="true">${MARK[k](a, b)}</svg>`;

const CONCEPTS = [
  { key: "kentongan", name: "A. Kentongan", tag: "Alat peringatan dini asli Indonesia",
    dark: ["#60b45f", "#d6af58"], light: ["#14301a", "#3f7a40"], ink: ["#f1f4ef", "#14301a"], accent: ["#d6af58", "#14301a"],
    meaning: [["Lambang", "Kentongan yang digantung di pos ronda. Sebelum ada sirene, inilah cara satu kampung diberi tahu ada bahaya."],
      ["Celah tengah", "Sumber bunyi kentongan: ancaman menjadi sinyal yang bisa didengar semua orang. Itu tugas WASPADA."],
      ["Huruf", "Tebal dan membulat seperti kayu yang dibubut, sehingga terasa hangat dan mudah didekati pengguna umum."]] },
  { key: "sandi", name: "B. Sandi W", tag: "Huruf W dalam sandi Morse: titik, garis, garis",
    dark: ["#d6af58", "#070d08"], light: ["#14301a", "#f1f4ef"], ink: ["#f1f4ef", "#14301a"], accent: ["#d6af58", "#3f7a40"],
    meaning: [["Lambang", "Pola dot-dash-dash adalah huruf W dalam Morse, bahasa komunikasi militer dan Pramuka. Inisial WASPADA ditulis sebagai sinyal, bukan gambar."],
      ["Tiga ketukan", "Dibaca juga sebagai alur produk: satu kejadian kecil (titik), lalu dua sumber yang menguatkannya menjadi peringatan."],
      ["Huruf", "Kotak dan tegas seperti stensil peti logistik. Palang huruf A terlepas menjadi satu garis Morse."]] },
  { key: "jaga", name: "C. Pos Jaga", tag: "Penjaga berdiri di tengah huruf W",
    dark: ["#60b45f", "#d6af58"], light: ["#14301a", "#3f7a40"], ink: ["#f1f4ef", "#14301a"], accent: ["#d6af58", "#3f7a40"],
    meaning: [["Lambang", "Puncak tengah W dipotong dan diberi titik: sosok penjaga yang berdiri di antara dua benteng dan tidak pernah tidur."],
      ["Titik emas", "Kepala penjaga sekaligus satu titik yang sedang diawasi. Warnanya dari bingkai emas lambang satuan."],
      ["Huruf", "Sudut dipotong miring seperti pelat kendaraan taktis. Titik penjaga diulang di ketiga huruf A."]] },
];

document.getElementById("app").innerHTML = CONCEPTS.map((c) => `
  <article>
    <header><h2>${c.name}</h2><p>${c.tag}</p></header>
    <div class="stage">
      <div class="panel lockup">${svgMark(c.key, ...c.dark)}${word(c.key, c.ink[0], c.accent[0])}</div>
      <div class="panel lockup light">${svgMark(c.key, ...c.light)}${word(c.key, c.ink[1], c.accent[1])}</div>
      <div class="panel fav">
        ${[64, 32, 16].map((s) => `<figure>${svgMark(c.key, ...c.dark, "", `width="${s}" height="${s}"`)}<figcaption>${s} px</figcaption></figure>`).join("")}
        <div class="tab">${svgMark(c.key, ...c.dark, "")}WASPADA</div>
      </div>
    </div>
    <div class="meaning">${c.meaning.map(([k, v]) => `<div><b>${k}</b><span>${v}</span></div>`).join("")}</div>
  </article>`).join("");
</script>
</body>
</html>
