# Rule = urutan langkah dalam satu window, per group_by.
# Tiap langkah: match (field: nilai atau list nilai), count (default 1), distinct (field yang harus beda-beda).
# Langkah ke-n hanya menghitung event yang timestamp-nya sama atau setelah langkah ke-(n-1) terpenuhi
# (sama: log beresolusi detik dari sumber berbeda tidak punya urutan pasti dalam satu detik).
#   threshold    = satu langkah dengan count
#   sequence     = beberapa langkah berurutan
#   cross-source = langkah yang match ke region/source berbeda
# mitre (opsional): teknik MITRE ATT&CK yang diwakili rule, ditampilkan di alert (https://attack.mitre.org).

# ---------- Log internal + threat intel (threat-informed) ----------

- name: Pemindaian port
  severity: medium
  window: 5m
  group_by: [src_ip]
  mitre: [{id: T1046, name: Network Service Discovery}]
  steps:
    - match: {event_type: ids.scan}
      count: 5
      distinct: dest_port
      min_distinct: 5

- name: Eksploitasi pada aset rentan KEV
  severity: high
  window: 30d  # status rentan dari KEV berlaku lama; serangan bisa datang berminggu-minggu kemudian
  group_by: [host]
  mitre: [{id: T1190, name: Exploit Public-Facing Application}]
  steps:
    - match: {event_type: vuln.kev_match}
    - match: {event_type: ids.exploit_attempt}

- name: Brute force berhasil masuk
  severity: high
  window: 10m
  group_by: [src_ip, host]
  mitre: [{id: T1110, name: Brute Force}, {id: T1078, name: Valid Accounts}]
  steps:
    - match: {event_type: auth.failed}
      count: 10
    - match: {event_type: auth.success}

- name: Intrusi berhasil pada aset rentan
  severity: critical
  window: 30d
  group_by: [host]
  mitre:
    - {id: T1190, name: Exploit Public-Facing Application}
    - {id: T1078, name: Valid Accounts}
  steps:
    - match: {event_type: vuln.kev_match}
    - match: {event_type: ids.exploit_attempt}
    - match: {event_type: auth.success}

- name: Pemindaian diikuti login berhasil
  severity: critical
  window: 30m
  group_by: [src_ip, host]
  mitre:
    - {id: T1046, name: Network Service Discovery}
    - {id: T1078, name: Valid Accounts}
  steps:
    - match: {event_type: ids.scan}
      count: 5
      distinct: dest_port
      min_distinct: 5
    - match: {event_type: auth.success}

# ---------- OSINT berita (konteks geopolitik) ----------

- name: Lonjakan pemberitaan
  severity: medium
  window: 1h
  group_by: [topic]
  steps:
    - match: {event_type: [news.incident, news.diplomatic, news.military, news.economic]}
      count: 5
      distinct: source
      min_distinct: 3

- name: Insiden diikuti respons diplomatik
  severity: high
  window: 6h
  group_by: [topic]
  steps:
    - match: {event_type: news.incident}
    - match: {event_type: news.diplomatic}

- name: Isu memanas lintas wilayah
  severity: critical
  window: 24h
  group_by: [topic]
  steps:
    - match: {event_type: news.incident, region: domestic}
    - match: {event_type: news.diplomatic, region: foreign}
    - match: {event_type: news.military}
