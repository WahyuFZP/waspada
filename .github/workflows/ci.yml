name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# push baru ke branch yang sama membatalkan run lama
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  siem:
    name: SIEM backend
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: waspada
          POSTGRES_PASSWORD: waspada  # DB sekali pakai di runner CI
          POSTGRES_DB: waspada_test
        ports: ["5433:5432"]  # sama dengan port host db di docker-compose.yml dan default test
        options: >-
          --health-cmd "pg_isready -U waspada"
          --health-interval 2s
          --health-retries 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # database GeoIP tidak diunduh di CI: test IP publik dilewati, test IP internal/dokumentasi tetap jalan
      - run: pytest -q -p no:cacheprovider

  apk-scanner:
    name: Pemeriksa APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk-scanner/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apk-scanner/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q -p no:cacheprovider

  shipper:
    name: Pengirim log
    runs-on: ubuntu-22.04  # ubuntu-latest (24.04) tidak menyediakan Python 3.8
    defaults:
      run:
        working-directory: shipper
    steps:
      - uses: actions/checkout@v5
      # versi minimum yang dijanjikan di README: server satuan cukup Python 3.8
      - uses: actions/setup-python@v6
        with:
          python-version: "3.8"
      - run: python -m unittest -v

  frontend:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
