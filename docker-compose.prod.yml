# Tambahan untuk VPS publik, dipakai bersama docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Hanya Caddy (80/443) yang terbuka ke internet; semua port lain tetap terikat 127.0.0.1 seperti di laptop.
# OpenWA berjalan dari repo-nya sendiri dan membuat jaringan "openwa-network"; jalankan OpenWA lebih dulu.

services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?isi SITE_ADDRESS di .env, mis. 1-2-3-4.sslip.io}
      JURI_USER: ${JURI_USER:?isi JURI_USER di .env}
      JURI_HASH: ${JURI_HASH:?isi JURI_HASH di .env (caddy hash-password)}
      SITE_ALIASES: ${SITE_ALIASES:-}  # opsional: alamat tambahan yang menyajikan situs yang sama, mis. alamat sslip.io
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # sertifikat HTTPS; jangan dihapus agar tidak kena batas Let's Encrypt
      - caddy_config:/config
    depends_on: [frontend, backend]

  frontend:
    build:
      context: ./frontend
      # path relatif: dashboard memanggil API di alamat yang sedang dibuka, jadi berjalan di domain utama maupun
      # SITE_ALIASES, dan ganti domain tidak perlu build ulang
      args:
        NEXT_PUBLIC_API_URL: /siem
        NEXT_PUBLIC_APK_API_URL: /apk-api
        NEXT_PUBLIC_WEB_API_URL: /web-api
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

  # tanpa --reload: di server kode tidak diubah langsung, dan pemantau berkas hanya menghabiskan CPU
  backend:
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 2
    networks: [default, openwa]
  apk-scanner:
    command: uvicorn main:app --host 0.0.0.0 --port 8000
  web-scanner:
    command: uvicorn main:app --host 0.0.0.0 --port 8000
  news-digest:
    networks: [default, openwa]

networks:
  openwa:
    external: true
    name: openwa-network

volumes:
  caddy_data:
  caddy_config:
