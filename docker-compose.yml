services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: waspada
      POSTGRES_PASSWORD: waspada  # kredensial demo lokal saja, jangan dipakai di server publik
      POSTGRES_DB: waspada
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waspada"]
      interval: 2s
      retries: 15

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://waspada:waspada@db:5432/waspada
      TEST_DATABASE_URL: postgresql://waspada:waspada@db:5432/waspada_test
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]  # kode live; --reload memuat ulang saat file diubah
    # graceful timeout: stream SSE tidak pernah selesai sendiri, tanpa ini --reload menunggu selamanya
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload --timeout-graceful-shutdown 2
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
