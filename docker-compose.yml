services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped  # semua service demo menyala lagi sendiri setelah Docker atau laptop restart
    environment:
      POSTGRES_USER: waspada
      POSTGRES_PASSWORD: waspada  # kredensial demo lokal saja, jangan dipakai di server publik
      POSTGRES_DB: waspada
    # 127.0.0.1: hanya laptop ini yang bisa terhubung, bukan seluruh Wi-Fi (penting di lokasi acara)
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waspada"]
      interval: 2s
      retries: 15

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://waspada:waspada@db:5432/waspada
      TEST_DATABASE_URL: postgresql://waspada:waspada@db:5432/waspada_test
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      # alert high/critical ke WhatsApp lewat OpenWA (dijalankan terpisah); kosong = WA nonaktif
      OPENWA_URL: ${OPENWA_URL:-}
      OPENWA_API_KEY: ${OPENWA_API_KEY:-}
      OPENWA_SESSION: ${OPENWA_SESSION:-}
      WA_ALERT_CHAT: ${WA_ALERT_CHAT:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3000}
      # wajib diisi bila /ingest dibuka untuk pengirim log di server lain; kosong = tanpa autentikasi (lokal saja)
      INGEST_TOKEN: ${INGEST_TOKEN:-}
    ports: ["127.0.0.1:8000:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]  # agar OpenWA di host terjangkau juga di Linux/VPS
    volumes: ["./backend:/app"]  # kode live; --reload memuat ulang saat file diubah
    # graceful timeout: stream SSE tidak pernah selesai sendiri, tanpa ini --reload menunggu selamanya
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload --timeout-graceful-shutdown 2
    depends_on:
      db: {condition: service_healthy}
    # siap = API menjawab (memori korelasi sudah dipulihkan); rss-poller menunggu ini agar polling pertama tidak gagal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/alerts?limit=1', timeout=3)"]
      interval: 5s
      start_period: 10s
      retries: 30

  # Pemeriksa APK: service terpisah dengan SQLite sendiri. APK dari luar dibaca di dalam container ini,
  # jadi bila ada celah di parser, dampaknya terkurung di sini.
  apk-scanner:
    build: ./apk-scanner/backend
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      # opsional: cek hash APK ke MalwareBazaar (kunci gratis di auth.abuse.ch); kosong = langkah ini dilewati
      ABUSECH_AUTH_KEY: ${ABUSECH_AUTH_KEY:-}
      # jembatan ke SIEM: hasil Berbahaya/Mencurigakan menjadi alert; kosongkan untuk mematikan
      SIEM_INGEST_URL: ${SIEM_INGEST_URL:-http://backend:8000/ingest}
      INGEST_TOKEN: ${INGEST_TOKEN:-}
      WASPADA_DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3000}
    ports: ["127.0.0.1:8001:8000"]
    volumes:
      # read-only: celah parser yang dipicu APK rekayasa tidak bisa menulis ulang kode di laptop
      - ./apk-scanner/backend:/app:ro
      - apkdata:/data               # APK karantina, laporan JSON, scans.db
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # androguard memuat seluruh DEX ke memori; batas ini menjaga laptop tetap hidup bila ada APK rekayasa
    mem_limit: 2g
    cpus: 2
    pids_limit: 256

  # Demo log nyata: server SSH latihan. Coba login dari laptop ini: ssh latihan@localhost -p 2222
  # Setiap percobaan menulis log asli ke volume demolog, yang dikirim log-shipper ke SIEM.
  ssh-target:
    build: ./demo/ssh-target
    restart: unless-stopped
    hostname: srv-latihan
    environment:
      SSH_DEMO_PASSWORD: ${SSH_DEMO_PASSWORD:-latihan123}
    ports: ["127.0.0.1:2222:22"]
    volumes: ["demolog:/var/log/waspada"]

  # Sensor IDS sungguhan: berbagi jaringan dengan ssh-target, jadi melihat semua paket yang masuk ke server itu.
  # Bila ssh-target dibuat ulang, jalankan ulang juga: docker compose restart suricata
  suricata:
    image: jasonish/suricata:8.0.7
    restart: unless-stopped
    network_mode: service:ssh-target
    command: -c /waspada/suricata.yaml --af-packet=eth0 -k none
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    volumes:
      - ./demo/suricata:/waspada:ro  # bukan /etc/suricata: entrypoint image melakukan chown di sana
      - idslog:/var/log/suricata
    depends_on: [ssh-target]

  # Pengirim log: skrip yang sama dengan yang dipasang di server satuan (shipper/waspada_shipper.py)
  log-shipper:
    image: python:3.12-alpine
    restart: unless-stopped
    command: python /app/waspada_shipper.py --api http://backend:8000 --auth /logs/auth.log --suricata /ids/eve.json
    environment:
      INGEST_TOKEN: ${INGEST_TOKEN:-}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./shipper:/app:ro
      - demolog:/logs:ro
      - idslog:/ids:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [backend, ssh-target, suricata]

  # Pembaca berita live: polling feed RSS di backend/feeds.yaml setiap 5 menit lalu mengirimnya ke /ingest.
  # Hentikan sementara (mis. menjaga kuota WA): docker compose stop rss-poller
  rss-poller:
    build: ./backend
    restart: unless-stopped
    command: python rss.py --api http://backend:8000
    environment:
      INGEST_TOKEN: ${INGEST_TOKEN:-}
    volumes: ["./backend:/app:ro"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      backend: {condition: service_healthy}

  # Ringkasan berita ke WhatsApp tim jaga: satu pesan per jam di DIGEST_JAM (WIB) berisi berita teratas sejak
  # pesan sebelumnya. Alert korelasi tetap dikirim langsung oleh backend. Hentikan: docker compose stop news-digest
  news-digest:
    build: ./backend
    restart: unless-stopped
    command: python digest.py --loop
    environment:
      DATABASE_URL: postgresql://waspada:waspada@db:5432/waspada
      OPENWA_URL: ${OPENWA_URL:-}
      OPENWA_API_KEY: ${OPENWA_API_KEY:-}
      OPENWA_SESSION: ${OPENWA_SESSION:-}
      WA_ALERT_CHAT: ${WA_ALERT_CHAT:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3000}
      DIGEST_JAM: ${DIGEST_JAM:-7,19}
      PYTHONUNBUFFERED: "1"
    extra_hosts: ["host.docker.internal:host-gateway"]  # OpenWA berjalan di host
    volumes: ["./backend:/app:ro"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    depends_on:
      db: {condition: service_healthy}

  # Pemeriksa Keamanan Web (pasif): mengambil respons target lalu mengamatinya. Beda dari apk-scanner,
  # service ini butuh egress jaringan. Untuk memindai localhost laptop, jalankan LOKAL (bukan Docker):
  # di dalam container "localhost" adalah container itu sendiri, bukan host.
  web-scanner:
    build: ./web-scanner/backend
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      SIEM_INGEST_URL: ${SIEM_INGEST_URL:-http://backend:8000/ingest}
      INGEST_TOKEN: ${INGEST_TOKEN:-}
      WASPADA_DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3000}
    ports: ["127.0.0.1:8002:8000"]
    volumes:
      - ./web-scanner/backend:/app:ro
      - webdata:/data
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1
    pids_limit: 128
    # siap = API menjawab; web-scheduler menunggu ini, kalau tidak lintasan pertamanya gagal dan baru dicoba sejam lagi
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/jadwal', timeout=3)"]
      interval: 5s
      start_period: 10s
      retries: 30

  # Pemicu penjadwal re-scan web: tiap jam menjalankan jadwal yang jatuh tempo (interval tiap situs diatur di /jadwal).
  # Alert ke SIEM/WhatsApp hanya untuk pemindaian dasar dan regresi, bukan setiap lintasan.
  web-scheduler:
    build: ./web-scanner/backend
    restart: unless-stopped
    command: python scheduler.py --loop 3600 --base http://web-scanner:8000
    volumes: ["./web-scanner/backend:/app:ro"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    depends_on:
      web-scanner: {condition: service_healthy}

volumes:
  pgdata:
  apkdata:
  demolog:
  idslog:
  webdata:
