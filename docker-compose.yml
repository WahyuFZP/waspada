services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: waspada
      POSTGRES_PASSWORD: waspada  # kredensial demo lokal saja, jangan dipakai di server publik
      POSTGRES_DB: waspada
    # 127.0.0.1: hanya laptop ini yang bisa terhubung, bukan seluruh Wi-Fi (penting di lokasi acara)
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waspada"]
      interval: 2s
      retries: 15

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://waspada:waspada@db:5432/waspada
      TEST_DATABASE_URL: postgresql://waspada:waspada@db:5432/waspada_test
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      # wajib diisi bila /ingest dibuka untuk pengirim log di server lain; kosong = tanpa autentikasi (lokal saja)
      INGEST_TOKEN: ${INGEST_TOKEN:-}
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./backend:/app"]  # kode live; --reload memuat ulang saat file diubah
    # graceful timeout: stream SSE tidak pernah selesai sendiri, tanpa ini --reload menunggu selamanya
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload --timeout-graceful-shutdown 2
    depends_on:
      db: {condition: service_healthy}

  # Pemeriksa APK: service terpisah dengan SQLite sendiri. APK dari luar dibaca di dalam container ini,
  # jadi bila ada celah di parser, dampaknya terkurung di sini.
  apk-scanner:
    build: ./apk-scanner/backend
    environment:
      DATA_DIR: /data
      # opsional: cek hash APK ke MalwareBazaar (kunci gratis di auth.abuse.ch); kosong = langkah ini dilewati
      ABUSECH_AUTH_KEY: ${ABUSECH_AUTH_KEY:-}
    ports: ["127.0.0.1:8001:8000"]
    volumes:
      # read-only: celah parser yang dipicu APK rekayasa tidak bisa menulis ulang kode di laptop
      - ./apk-scanner/backend:/app:ro
      - apkdata:/data               # APK karantina, laporan JSON, scans.db
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # androguard memuat seluruh DEX ke memori; batas ini menjaga laptop tetap hidup bila ada APK rekayasa
    mem_limit: 2g
    cpus: 2
    pids_limit: 256

  # Demo log nyata: server SSH latihan. Coba login dari laptop ini: ssh latihan@localhost -p 2222
  # Setiap percobaan menulis log asli ke volume demolog, yang dikirim log-shipper ke SIEM.
  ssh-target:
    build: ./demo/ssh-target
    hostname: srv-latihan
    environment:
      SSH_DEMO_PASSWORD: ${SSH_DEMO_PASSWORD:-latihan123}
    ports: ["127.0.0.1:2222:22"]
    volumes: ["demolog:/var/log/waspada"]

  # Sensor IDS sungguhan: berbagi jaringan dengan ssh-target, jadi melihat semua paket yang masuk ke server itu.
  # Bila ssh-target dibuat ulang, jalankan ulang juga: docker compose restart suricata
  suricata:
    image: jasonish/suricata:8.0.7
    network_mode: service:ssh-target
    command: -c /waspada/suricata.yaml --af-packet=eth0 -k none
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    volumes:
      - ./demo/suricata:/waspada:ro  # bukan /etc/suricata: entrypoint image melakukan chown di sana
      - idslog:/var/log/suricata
    depends_on: [ssh-target]

  # Pengirim log: skrip yang sama dengan yang dipasang di server satuan (shipper/waspada_shipper.py)
  log-shipper:
    image: python:3.12-alpine
    command: python /app/waspada_shipper.py --api http://backend:8000 --auth /logs/auth.log --suricata /ids/eve.json
    environment:
      INGEST_TOKEN: ${INGEST_TOKEN:-}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./shipper:/app:ro
      - demolog:/logs:ro
      - idslog:/ids:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [backend, ssh-target, suricata]

volumes:
  pgdata:
  apkdata:
  demolog:
  idslog:
